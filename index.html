<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maximiliano Perez — Abogado</title>
<meta name="description" content="Maximiliano Perez. Abogado, escribano, procurador, magister en derecho.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blanco:#FFFFFF;
  --hueso:#F6F5F3;
  --negro:#111111;
  --gris:#5C5C5C;
  --linea:#E4E1DE;
  --rojo:#7E1220;
  --rojo-claro:#9B2130;
  --fuente:'Montserrat', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--blanco);color:var(--negro);font-family:var(--fuente);font-weight:400;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.cinta{height:5px;background:linear-gradient(90deg,var(--rojo) 0 62%, var(--negro) 62% 100%)}
.label{font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--rojo)}

/* ---------- Presentación ---------- */
.hero{padding:74px 0 68px;display:grid;grid-template-columns:auto 1fr;gap:66px;align-items:center}
.marco-foto{position:relative;flex:0 0 auto;justify-self:center}
.retrato{
  width:clamp(210px,24vw,290px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:var(--hueso);position:relative;z-index:2;box-shadow:0 0 0 1px var(--linea);
}
.retrato img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.marco-foto::before{
  content:"";position:absolute;inset:-16px;border-radius:50%;
  border:2px solid var(--rojo);border-right-color:transparent;border-bottom-color:transparent;
  transform:rotate(-38deg);z-index:1;
}
.marco-foto::after{
  content:"";position:absolute;right:-6px;bottom:6px;width:64px;height:64px;
  background:var(--hueso);border-left:3px solid var(--rojo);z-index:0;
}
.identidad h1{
  font-weight:800;text-transform:uppercase;
  font-size:clamp(2rem,5.4vw,3.9rem);line-height:1.02;letter-spacing:-.01em;margin:14px 0 0;
}
.identidad h1 span{display:block;color:var(--rojo)}
.credenciales{margin-top:22px;padding-top:20px;border-top:2px solid var(--negro);display:flex;flex-wrap:wrap;gap:10px 26px}
.credenciales li{list-style:none;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--negro);display:flex;align-items:center;gap:9px}
.credenciales li::before{content:"";width:7px;height:7px;background:var(--rojo)}
.boton{
  display:inline-flex;align-items:center;gap:11px;margin-top:32px;
  background:var(--rojo);color:#fff;text-decoration:none;
  padding:16px 32px;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  transition:background .25s ease,transform .25s ease;
}
.boton:hover{background:var(--negro);transform:translateY(-2px)}
.boton svg{width:17px;height:17px;fill:currentColor}

/* ---------- Franja de fotos ---------- */
.marquesina{overflow:hidden;width:100%;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);pointer-events:none;background:var(--hueso)}
.tira{display:flex;width:max-content;animation:desliza 24s linear infinite}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tira figure{flex:0 0 auto;margin-right:6px;width:clamp(200px,21vw,300px);aspect-ratio:3/4;overflow:hidden;background:#eceae7}
.tira img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Áreas ---------- */
.areas{padding:86px 0 96px;background:var(--hueso)}
.encabezado{text-align:center;margin-bottom:48px}
.encabezado h2{font-weight:800;text-transform:uppercase;font-size:clamp(1.5rem,3.6vw,2.3rem);letter-spacing:-.01em;margin-top:14px}
.encabezado h2::after{content:"";display:block;width:56px;height:3px;background:var(--rojo);margin:20px auto 0}
.grilla{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
.tarjeta{
  grid-column:span 1;background:var(--blanco);border:1px solid var(--linea);border-top:4px solid var(--negro);
  padding:38px 30px 32px;text-align:left;font-family:var(--fuente);cursor:pointer;
  transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease;width:100%;
}
.tarjeta:hover{border-top-color:var(--rojo);box-shadow:0 14px 34px rgba(17,17,17,.09);transform:translateY(-3px)}
.tarjeta[aria-expanded="true"]{grid-column:1/-1;border-top-color:var(--rojo);box-shadow:0 14px 34px rgba(17,17,17,.09)}
.tarjeta:focus-visible{outline:2px solid var(--rojo);outline-offset:3px}
.icono{width:52px;height:52px;display:grid;place-items:center;background:var(--hueso);margin-bottom:22px}
.icono svg{width:26px;height:26px;stroke:var(--rojo);fill:none;stroke-width:1.6}
.tarjeta h3{font-size:1.02rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
.tarjeta .resumen{margin-top:12px;font-size:.9rem;color:var(--gris);font-weight:400}
.mas{margin-top:22px;font-size:.64rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rojo);display:flex;align-items:center;gap:9px}
.mas::after{content:"+";font-size:1.05rem;line-height:1;transition:transform .3s ease}
.tarjeta[aria-expanded="true"] .mas::after{transform:rotate(45deg)}
.detalle{max-height:0;overflow:hidden;transition:max-height .5s ease}
.tarjeta[aria-expanded="true"] .detalle{max-height:900px}
.detalle-int{padding-top:26px;margin-top:26px;border-top:1px solid var(--linea)}
.lista{list-style:none;columns:2;column-gap:44px}
.lista li{padding:11px 0;border-bottom:1px solid var(--linea);font-size:.9rem;display:flex;gap:13px;break-inside:avoid}
.lista li::before{content:"";flex:0 0 6px;height:6px;background:var(--rojo);margin-top:.6em}
.nota{margin-top:22px;display:inline-block;background:var(--negro);color:#fff;padding:9px 18px;font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* ---------- Pie ---------- */
footer{background:var(--negro);color:rgba(255,255,255,.55);padding:38px 0;text-align:center;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}

/* ---------- WhatsApp ---------- */
.wsp{
  position:fixed;right:22px;bottom:22px;z-index:50;width:58px;height:58px;border-radius:50%;
  background:var(--rojo);color:#fff;display:grid;place-items:center;text-decoration:none;
  box-shadow:0 6px 20px rgba(0,0,0,.24);transition:transform .25s ease,background .25s ease;
}
.wsp:hover{background:var(--negro);transform:translateY(-3px)}
.wsp:focus-visible{outline:2px solid var(--rojo);outline-offset:4px}
.wsp svg{width:29px;height:29px;fill:currentColor}

@media (max-width:900px){
  .grilla{grid-template-columns:1fr}
  .tarjeta[aria-expanded="true"]{grid-column:auto}
  .lista{columns:1}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:36px;text-align:center;padding:52px 0 46px}
  .credenciales{justify-content:center;border-top:none;padding-top:0}
  .identidad .label{display:block}
  .marco-foto::after{display:none}
  .tira{animation-duration:17s}
  .areas{padding:62px 0 70px}
  .wsp{right:16px;bottom:16px;width:54px;height:54px}
}
</style>
</head>

<script>
(function(){
  const tarjetas = Array.from(document.querySelectorAll('.tarjeta'));
  tarjetas.forEach(t => {
    t.addEventListener('click', () => {
      const abierta = t.getAttribute('aria-expanded') === 'true';
      tarjetas.forEach(o => o.setAttribute('aria-expanded', 'false'));
      t.setAttribute('aria-expanded', abierta ? 'false' : 'true');
      if(!abierta) t.querySelector('.mas').textContent = 'Cerrar';
      tarjetas.forEach(o => {
        if(o.getAttribute('aria-expanded') === 'false') o.querySelector('.mas').textContent = 'Ver detalle';
      });
    });
  });
  document.getElementById('anio').textContent = new Date().getFullYear();
})();
</script>
